[tool.poetry]
name = "quare"
version = "0.1.0"
description = "QUality AnalyzeR of application Efficiency — performance profiling analytics framework"
authors = ["Marcin Lawenda <lawenda@man.poznan.pl>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/HiPERACT-Data-analytics-and-AI/Quare"
repository = "https://github.com/HiPERACT-Data-analytics-and-AI/Quare"
keywords = ["profiling", "HPC", "performance analysis", "AMD uProf", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Benchmark",
]

[tool.poetry.dependencies]
python = "^3.10"
SQLAlchemy = "^2.0.28"
pandas = "^2.0"
numpy = "^1.26"
matplotlib = "^3.9.2"

[tool.poetry.scripts]
quare = "quare.__main__:main"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.2"
pylint = "^3.0"
sphinx = "^7.3.7"
sphinx-rtd-theme = "^2.0.0"
sphinx-autodoc-typehints = "^2.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
