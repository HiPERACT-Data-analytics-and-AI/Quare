[project]
name = "quare"
version = "0.1.0"
description = "QUality AnalyzeR of application Efficiency — performance profiling analytics framework"
authors = [
    {name = "Marcin Lawenda", email = "lawenda@man.poznan.pl"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["profiling", "HPC", "performance analysis", "AMD uProf", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "SQLAlchemy>=2.0.28,<3",
    "pandas>=2.0,<3",
    "numpy>=1.26,<2",
    "matplotlib>=3.9.2,<4",
]

[project.urls]
Homepage = "https://github.com/HiPERACT-Data-analytics-and-AI/Quare"
Repository = "https://github.com/HiPERACT-Data-analytics-and-AI/Quare"

[project.scripts]
quare = "quare.__main__:main"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.2"
pylint = "^3.0"
sphinx = "^7.3.7"
sphinx-rtd-theme = "^2.0.0"
sphinx-autodoc-typehints = "^2.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
