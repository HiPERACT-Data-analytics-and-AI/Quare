[tool.poetry]
name = "quare"
version = "0.1.0"
description = "QUality AnalyzeR of application Efficiency — performance profiling analytics framework"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
prettytable = "^3.10.0"
tk = "^0.1.0"
seaborn = "^0.13.2"
SQLAlchemy = "^2.0.28"

[tool.poetry.scripts]
quare = "quare.__main__:main"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.2"
sphinx = "^7.3.7"
sphinx-rtd-theme = "^2.0.0"
sphinx-autodoc-typehints = "^2.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
